<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">KETHIVO Smart Agriculture Assistant</title>
  <desc id="desc">A farmer using a smartphone in green fields, with smart agriculture information cards, irrigation, a drone, hills and a sunny sky.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#f5ffe9"/></linearGradient>
    <linearGradient id="field" x2="0" y2="1"><stop stop-color="#8bd66d"/><stop offset="1" stop-color="#238b4a"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4fbf4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#174c35" flood-opacity=".16"/></filter>
    <clipPath id="screen"><rect x="0" y="0" width="1600" height="900" rx="34"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
    <rect width="1600" height="900" fill="url(#sky)"/>
    <circle cx="1320" cy="150" r="78" fill="#ffd45b"/>
    <circle cx="1320" cy="150" r="104" fill="#ffd45b" opacity=".16"/>
    <!-- distant hills -->
    <path d="M0 475 Q160 320 330 430 T680 410 T1030 430 T1370 360 T1600 450 V900 H0Z" fill="#a8d98a"/>
    <path d="M0 530 Q220 390 430 500 T850 470 T1240 490 T1600 430 V900 H0Z" fill="#71bd69"/>
    <!-- fields -->
    <path d="M0 570 Q350 500 700 590 T1600 550 V900 H0Z" fill="url(#field)"/>
    <path d="M0 690 Q350 590 760 700 T1600 640" fill="none" stroke="#c9ed91" stroke-width="10" opacity=".55"/>
    <path d="M0 770 Q360 670 760 780 T1600 720" fill="none" stroke="#d9f5a8" stroke-width="8" opacity=".42"/>
    <g stroke="#e0f4a9" stroke-width="5" opacity=".75" fill="none">
      <path d="M60 900 Q250 720 470 630"/><path d="M210 900 Q390 730 600 640"/>
      <path d="M1330 900 Q1210 730 1010 630"/><path d="M1490 900 Q1350 730 1160 650"/>
    </g>
    <!-- small farmhouse -->
    <g transform="translate(1120 405)">
      <rect x="0" y="55" width="150" height="100" rx="5" fill="#fff5dc"/>
      <path d="M-15 62 L75 0 L165 62Z" fill="#b85f3e"/>
      <rect x="62" y="93" width="35" height="62" fill="#8b583e"/>
      <rect x="18" y="78" width="30" height="28" fill="#a9dff0"/>
      <rect x="108" y="78" width="25" height="28" fill="#a9dff0"/>
    </g>
    <!-- irrigation sprinkler -->
    <g transform="translate(250 610)" stroke="#287d50" stroke-width="9" stroke-linecap="round">
      <path d="M0 0 V105 M-27 105 H27 M0 0 L-25 -18 M0 0 L25 -18"/>
      <path d="M-28 -18 Q-70 -45 -82 -85 M28 -18 Q70 -45 82 -85" fill="none" stroke="#4daee3" stroke-width="5" stroke-dasharray="3 12"/>
    </g>
    <!-- drone -->
    <g transform="translate(1020 250)" stroke="#355b51" stroke-width="8" stroke-linecap="round" fill="none">
      <rect x="-28" y="-15" width="56" height="30" rx="12" fill="#f5fff8"/>
      <path d="M-25 -5 L-80 -30 M25 -5 L80 -30 M-25 5 L-80 30 M25 5 L80 30"/>
      <path d="M-112 -32 H-62 M62 -32 H112 M-112 32 H-62 M62 32 H112" stroke-width="5"/>
      <circle cx="-88" cy="-32" r="7" fill="#355b51"/><circle cx="88" cy="-32" r="7" fill="#355b51"/>
      <circle cx="-88" cy="32" r="7" fill="#355b51"/><circle cx="88" cy="32" r="7" fill="#355b51"/>
    </g>
    <!-- farmer -->
    <g transform="translate(710 445)">
      <!-- legs -->
      <path d="M-55 230 L-68 360 L-18 360 L8 245 M35 235 L48 360 L98 360 L92 220" fill="#344b3c"/>
      <path d="M-76 355 H-15 Q-4 355 0 375 H-90Z M42 355 H100 Q115 355 120 375 H42Z" fill="#4a4638"/>
      <!-- body -->
      <path d="M-83 65 Q-45 35 15 48 Q75 35 100 85 L90 250 Q20 280 -75 245Z" fill="#f5f7ee"/>
      <path d="M-35 55 L5 110 L40 55 L68 245 L-55 245Z" fill="#4e9c58"/>
      <path d="M-35 65 L40 65 M-48 95 L55 95 M-52 125 L60 125 M-58 155 L65 155 M-60 185 L67 185" stroke="#d5e8b7" stroke-width="7"/>
      <!-- neck and head -->
      <rect x="-15" y="25" width="45" height="48" rx="15" fill="#a96e45"/>
      <ellipse cx="5" cy="-22" rx="62" ry="72" fill="#b9794c"/>
      <!-- turban -->
      <path d="M-58 -35 Q-72 -105 5 -110 Q72 -105 63 -34 Q24 -5 -58 -35Z" fill="#fffdf2"/>
      <path d="M-57 -55 Q0 -28 62 -55 M-48 -77 Q5 -51 52 -77" fill="none" stroke="#d8dfd1" stroke-width="8"/>
      <!-- face -->
      <path d="M-22 -12 Q5 5 32 -12" fill="none" stroke="#69452f" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-18" cy="-35" r="5" fill="#302d26"/><circle cx="25" cy="-35" r="5" fill="#302d26"/>
      <!-- arm holding phone -->
      <path d="M75 92 Q120 120 112 178 L75 198 Q50 173 50 145" fill="none" stroke="#b9794c" stroke-width="27" stroke-linecap="round"/>
      <rect x="90" y="110" width="53" height="88" rx="10" fill="#263c36" transform="rotate(8 90 110)"/>
      <rect x="97" y="119" width="39" height="68" rx="5" fill="#b8e7c4" transform="rotate(8 97 119)"/>
      <path d="M106 145 l9 9 16 -20" fill="none" stroke="#27864e" stroke-width="5" transform="rotate(8 106 145)"/>
      <!-- other arm -->
      <path d="M-75 100 Q-125 145 -105 210" fill="none" stroke="#b9794c" stroke-width="26" stroke-linecap="round"/>
    </g>
    <!-- floating cards -->
    <g filter="url(#shadow)">
      <g transform="translate(70 85)">
        <rect width="300" height="150" rx="22" fill="url(#card)"/>
        <circle cx="48" cy="48" r="26" fill="#fff0b5"/>
        <circle cx="48" cy="48" r="12" fill="#f5b934"/>
        <path d="M30 80 Q48 64 66 80" fill="none" stroke="#6aa8d4" stroke-width="7" stroke-linecap="round"/>
        <text x="88" y="48" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#244b39">WEATHER</text>
        <text x="28" y="112" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#244b39">28°C  ·  Sunny</text>
        <text x="28" y="137" font-family="Arial,sans-serif" font-size="15" fill="#63806c">Good conditions today</text>
      </g>
      <g transform="translate(1190 245)">
        <rect width="330" height="160" rx="22" fill="url(#card)"/>
        <circle cx="48" cy="48" r="26" fill="#e2f6d9"/>
        <path d="M48 67 V30 M48 45 Q28 42 29 27 Q48 27 48 45 M48 52 Q68 49 67 34 Q48 34 48 52" fill="#4d9c56"/>
        <text x="88" y="48" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#244b39">CROP ADVICE</text>
        <text x="28" y="105" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#287c48">Paddy / Rice</text>
        <text x="28" y="134" font-family="Arial,sans-serif" font-size="15" fill="#63806c">Suggestions for your farm</text>
      </g>
      <g transform="translate(65 300)">
        <rect width="310" height="155" rx="22" fill="url(#card)"/>
        <circle cx="48" cy="48" r="26" fill="#e3f5e8"/>
        <path d="M31 50 Q48 20 65 50 Q48 80 31 50Z" fill="#55a96a"/>
        <path d="M48 28 V70" stroke="#fff" stroke-width="3"/>
        <text x="88" y="48" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#244b39">CROP HEALTH</text>
        <text x="28" y="108" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#287c48">Healthy crop</text>
        <text x="28" y="135" font-family="Arial,sans-serif" font-size="15" fill="#63806c">AI-assisted screening</text>
      </g>
      <g transform="translate(1190 500)">
        <rect width="330" height="150" rx="22" fill="url(#card)"/>
        <circle cx="48" cy="48" r="26" fill="#e1f2ff"/>
        <path d="M29 60 L43 44 L53 52 L69 31" fill="none" stroke="#398bc2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="88" y="48" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#244b39">MARKET GUIDE</text>
        <text x="28" y="105" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#287c48">Local mandi rates</text>
        <text x="28" y="132" font-family="Arial,sans-serif" font-size="15" fill="#63806c">Check reference prices</text>
      </g>
    </g>
    <!-- brand footer -->
    <g transform="translate(65 805)">
      <circle cx="32" cy="28" r="27" fill="#fff" opacity=".9"/>
      <path d="M32 48 V19 M32 31 Q13 30 15 13 Q32 13 32 31 M32 37 Q51 36 49 19 Q32 19 32 37" fill="#2d9652"/>
      <text x="76" y="28" font-family="Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="3" fill="#174c35">KETHIVO</text>
      <text x="78" y="53" font-family="Arial,sans-serif" font-size="15" letter-spacing="1.3" fill="#376b4c">SMART AGRICULTURE ASSISTANT</text>
    </g>
  </g>
</svg>